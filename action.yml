name: "Rust Cut Tag"
description: "Bump version in Cargo.toml and create a git tag for Rust projects"
author: "Jimmie Fulton <jimmie.fulton@gmail.com>"

# Define the inputs for this action
inputs:
  version-level:
    description: "Version level to bump (patch, minor, or major)"
    required: false
    default: "patch"
  working-directory:
    description: "Working directory containing Cargo.toml"
    required: false
    default: "."
  commit-changes:
    description: "Whether to commit the version changes"
    required: false
    default: "true"
  commit-message:
    description: "Custom commit message. Use {version} as placeholder for the new version"
    required: false
    default: "Bump version to {version} [skip ci]"
  skip-push:
    description: "Skip pushing changes and tags (useful for testing)"
    required: false
    default: "false"
  workspace:
    description: "Apply to all workspace members"
    required: false
    default: "true"
  no-git-commit:
    description: "Do not create a git commit (cargo-release option)"
    required: false
    default: "false"
  no-git-tag:
    description: "Do not create a git tag (cargo-release option)"
    required: false
    default: "false"
  no-git-push:
    description: "Do not push to git (cargo-release option)"
    required: false
    default: "false"

# Define the outputs for this action
outputs:
  version:
    description: "The new version number"
    value: ${{ steps.bump-version.outputs.version }}
  tag:
    description: "The created git tag"
    value: ${{ steps.bump-version.outputs.tag }}

# Define the runs configuration
runs:
  using: "composite"
  steps:
    - name: Install cargo-release
      uses: baptiste0928/cargo-install@v3
      with:
        crate: cargo-release
        args: --no-default-features

    - name: Configure Git
      shell: bash
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: Bump version and create tag
      id: bump-version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -e

        # Validate version-level input
        VERSION_LEVEL="${{ inputs.version-level }}"
        if [[ ! "$VERSION_LEVEL" =~ ^(patch|minor|major)$ ]]; then
          echo "Error: version-level must be 'patch', 'minor', or 'major'"
          exit 1
        fi

        # Build cargo release command
        CMD="cargo release version $VERSION_LEVEL --execute --no-confirm"

        # Add workspace flag if enabled
        if [[ "${{ inputs.workspace }}" == "true" ]]; then
          CMD="$CMD --workspace"
        fi

        # Add git-related flags
        if [[ "${{ inputs.no-git-commit }}" == "true" ]]; then
          CMD="$CMD --no-git-commit"
        fi

        if [[ "${{ inputs.no-git-tag }}" == "true" ]]; then
          CMD="$CMD --no-git-tag"
        fi

        if [[ "${{ inputs.no-git-push }}" == "true" ]]; then
          CMD="$CMD --no-git-push"
        fi

        echo "Executing: $CMD"
        $CMD

        # Get the new version from Cargo.toml (handle workspace manifests)
        if command -v toml &> /dev/null; then
          NEW_VERSION=$(toml get Cargo.toml package.version 2>/dev/null | tr -d '"' || true)
        fi

        # If no version found (workspace manifest), find first member crate
        if [[ -z "$NEW_VERSION" ]]; then
          # Try to find a member crate's Cargo.toml
          MEMBER_TOML=$(find . -path ./target -prune -o -name "Cargo.toml" -print 2>/dev/null | grep -v "^\./Cargo.toml$" | head -1)
          if [[ -n "$MEMBER_TOML" ]]; then
            NEW_VERSION=$(grep -m1 '^version' "$MEMBER_TOML" | cut -d '"' -f2)
          fi
        fi

        # Fallback: try root Cargo.toml anyway
        if [[ -z "$NEW_VERSION" ]]; then
          NEW_VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2 || true)
        fi

        if [[ -z "$NEW_VERSION" ]]; then
          echo "Error: Could not determine version from Cargo.toml"
          exit 1
        fi

        echo "New version: $NEW_VERSION"
        TAG="v$NEW_VERSION"
        echo "Tag: $TAG"

        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "tag=$TAG" >> $GITHUB_OUTPUT

        # Handle custom commit and push logic if cargo-release didn't do it
        if [[ "${{ inputs.no-git-commit }}" == "false" && "${{ inputs.commit-changes }}" == "true" ]]; then
          # cargo-release already committed
          :
        elif [[ "${{ inputs.no-git-commit }}" == "true" && "${{ inputs.commit-changes }}" == "true" ]]; then
          # We need to commit manually
          COMMIT_MESSAGE="${{ inputs.commit-message }}"
          COMMIT_MESSAGE="${COMMIT_MESSAGE//\{version\}/$NEW_VERSION}"

          git add -A
          git commit -m "$COMMIT_MESSAGE" || echo "No changes to commit"

          if [[ "${{ inputs.no-git-tag }}" == "true" ]]; then
            git tag "$TAG"
          fi
        fi

        # Push if needed
        if [[ "${{ inputs.skip-push }}" != "true" && "${{ inputs.no-git-push }}" == "true" ]]; then
          if [[ "${{ inputs.commit-changes }}" == "true" ]]; then
            git push origin HEAD
          fi
          if [[ "${{ inputs.no-git-tag }}" != "true" ]] || git tag -l "$TAG" | grep -q "$TAG"; then
            git push origin "$TAG"
          fi
        fi

# Define the branding for the action in the GitHub Marketplace
branding:
  icon: "tag"
  color: "orange"