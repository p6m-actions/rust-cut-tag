name: "Rust Cut Tag"
description: "Bump version in Cargo.toml and create a git tag for Rust projects"
author: "Jimmie Fulton <jimmie.fulton@gmail.com>"

# Define the inputs for this action
inputs:
  version-level:
    description: "Version level to bump (patch, minor, or major)"
    required: false
    default: "patch"
  working-directory:
    description: "Working directory containing Cargo.toml"
    required: false
    default: "."
  commit-changes:
    description: "Whether to commit the version changes"
    required: false
    default: "true"
  commit-message:
    description: "Custom commit message. Use {version} as placeholder for the new version"
    required: false
    default: "Bump version to {version} [skip ci]"
  skip-push:
    description: "Skip pushing changes and tags (useful for testing)"
    required: false
    default: "false"
  workspace:
    description: "Apply to all workspace members"
    required: false
    default: "true"

# Define the outputs for this action
outputs:
  version:
    description: "The new version number"
    value: ${{ steps.bump-version.outputs.version }}
  tag:
    description: "The created git tag"
    value: ${{ steps.bump-version.outputs.tag }}

# Define the runs configuration
runs:
  using: "composite"
  steps:
    - name: Install cargo-release
      uses: baptiste0928/cargo-install@v3
      with:
        crate: cargo-release
        args: --no-default-features

    - name: Configure Git
      shell: bash
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: Bump version and create tag
      id: bump-version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -e

        # Validate version-level input
        VERSION_LEVEL="${{ inputs.version-level }}"
        if [[ ! "$VERSION_LEVEL" =~ ^(patch|minor|major)$ ]]; then
          echo "Error: version-level must be 'patch', 'minor', or 'major'"
          exit 1
        fi

        # Build cargo release command
        CMD="cargo release version $VERSION_LEVEL --execute --no-confirm"

        # Add workspace flag if enabled
        if [[ "${{ inputs.workspace }}" == "true" ]]; then
          CMD="$CMD --workspace"
        fi

        # Note: cargo release version only bumps versions in Cargo.toml files.
        # It does NOT commit, tag, or push - we handle those steps manually below.

        echo "Executing: $CMD"
        $CMD

        # Get the new version using cargo metadata (handles workspace inheritance properly)
        NEW_VERSION=$(cargo metadata --format-version 1 --no-deps 2>/dev/null | jq -r '.packages[0].version' || true)

        # Fallback: try parsing workspace.package.version from root Cargo.toml
        if [[ -z "$NEW_VERSION" || "$NEW_VERSION" == "null" ]]; then
          NEW_VERSION=$(grep -A1 '\[workspace\.package\]' Cargo.toml | grep -E '^\s*version\s*=' | sed 's/.*=\s*"\([^"]*\)".*/\1/' || true)
        fi

        # Fallback: try package.version from root Cargo.toml
        if [[ -z "$NEW_VERSION" ]]; then
          NEW_VERSION=$(grep -A10 '^\[package\]' Cargo.toml | grep -E '^\s*version\s*=' | head -1 | sed 's/.*=\s*"\([^"]*\)".*/\1/' || true)
        fi

        if [[ -z "$NEW_VERSION" ]]; then
          echo "Error: Could not determine version from Cargo.toml"
          exit 1
        fi

        echo "New version: $NEW_VERSION"
        TAG="v$NEW_VERSION"
        echo "Tag: $TAG"

        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "tag=$TAG" >> $GITHUB_OUTPUT

        # Commit version changes (cargo release version only modifies files, doesn't commit)
        if [[ "${{ inputs.commit-changes }}" == "true" ]]; then
          COMMIT_MESSAGE="${{ inputs.commit-message }}"
          COMMIT_MESSAGE="${COMMIT_MESSAGE//\{version\}/$NEW_VERSION}"

          git add -A
          git commit -m "$COMMIT_MESSAGE" || echo "No changes to commit"
        fi

        # Create tag
        git tag -f "$TAG"
        echo "Created tag: $TAG"

        # Push commit and tag to remote
        if [[ "${{ inputs.skip-push }}" != "true" ]]; then
          echo "Pushing changes to remote..."

          if [[ "${{ inputs.commit-changes }}" == "true" ]]; then
            # Use --force-with-lease for safety - fails if someone else pushed
            git push origin HEAD --force-with-lease
            echo "Pushed commit to origin"
          fi

          # Force push tag in case it exists pointing to wrong commit
          git push origin "$TAG" --force
          echo "Pushed tag $TAG to origin"
        else
          echo "Skipping push (skip-push=true)"
        fi

# Define the branding for the action in the GitHub Marketplace
branding:
  icon: "tag"
  color: "orange"